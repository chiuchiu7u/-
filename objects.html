<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Objects · Cybercore Decor</title>
<style>
/* ============================================================
   3D OBJECT SHOWCASE — realistic matte cybercore ornaments
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%,#f8f3ec 0%,#ebe3d6 60%,#ddd3c4 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  gap:3rem;flex-wrap:wrap;
  padding:3rem;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* Each object wrapper — transparent bg, suitable for floating */
.obj-wrapper{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  cursor:default;
}
.obj-wrapper:hover{transform:translateY(-8px)}
.obj-label{
  font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
  color:#aaa;opacity:.7;
}

/* ── Shared: soft global shadow plane under every object ── */
.obj-shadow{
  position:absolute;
  bottom:-6px;left:50%;transform:translateX(-50%);
  width:75%;height:14px;
  border-radius:50%;
  background:rgba(140,120,100,.12);
  filter:blur(8px);
  z-index:0;
}

/* ============================================================
   ① POLAROID — 3D photo card, tilted naturally
   ============================================================ */
.polaroid-scene{
  position:relative;z-index:1;
  width:180px;height:220px;
  transform:perspective(800px) rotateX(2deg) rotateY(-4deg) rotate(1deg);
  transform-style:preserve-3d;
}

/* Shadow beneath polaroid */
.polaroid-scene::after{
  content:"";position:absolute;
  bottom:-14px;left:5%;width:90%;height:20px;
  background:rgba(120,100,80,.1);
  border-radius:50%;
  filter:blur(14px);
  z-index:-1;
  transform:translateZ(-10px);
}

/* Polaroid body — thick paper card */
.polaroid-card{
  position:relative;
  width:100%;height:100%;
  background:linear-gradient(175deg,#fdfdfb 0%,#f7f5f0 40%,#f0ece4 100%);
  border-radius:2px;
  padding:10px 10px 36px;
  box-shadow:
    /* soft ambient */
    0 1px 3px rgba(0,0,0,.04),
    0 3px 6px rgba(0,0,0,.05),
    0 8px 20px rgba(0,0,0,.06),
    0 20px 50px rgba(100,80,60,.05),
    /* paper edge thickness */
    inset 0 0 0 1px rgba(255,255,255,.9),
    inset 0 -1px 2px rgba(0,0,0,.03);
  /* subtle paper curl */
  transform:rotateY(.5deg);
}

/* Paper fiber texture overlay */
.polaroid-card::before{
  content:"";
  position:absolute;inset:0;border-radius:2px;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(0,0,0,.008) 40px,rgba(0,0,0,.008) 41px),
    repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,0,0,.005) 60px,rgba(0,0,0,.005) 61px);
  pointer-events:none;z-index:2;
}

/* Photo area */
.polaroid-photo{
  width:100%;height:100%;
  background:linear-gradient(155deg,#d4c8b8 0%,#e0d4c4 25%,#d8ccbc 50%,#ddd0c0 75%,#d0c4b4 100%);
  border-radius:1px;
  position:relative;overflow:hidden;
}
/* Subtle photo vignette */
.polaroid-photo::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.06) 100%);
}
.polaroid-photo .p-subject{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;opacity:.12;filter:grayscale(.4);
}

/* Bottom caption */
.polaroid-caption{
  position:absolute;bottom:8px;left:0;right:0;
  text-align:center;
  font-size:.52rem;color:#b8a898;
  letter-spacing:.04em;
  font-style:italic;
}

/* Tape piece — semi-transparent matte tape */
.polaroid-tape{
  position:absolute;top:-10px;right:22px;
  width:30px;height:14px;
  background:rgba(245,240,225,.5);
  border-radius:1px;
  transform:rotate(7deg);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  z-index:3;
}

/* ============================================================
   ② GLASS JAR — transparent with matte cork lid
   ============================================================ */
.jar-scene{
  position:relative;z-index:1;
  width:100px;height:130px;
  transform:perspective(700px) rotateX(1deg) rotateY(5deg) rotate(-2deg);
  transform-style:preserve-3d;
}
.jar-scene::after{
  content:"";position:absolute;
  bottom:-18px;left:10%;width:80%;height:22px;
  background:rgba(120,100,80,.1);
  border-radius:50%;
  filter:blur(16px);
  z-index:-1;
  transform:translateZ(-10px);
}

.jar-svg{
  width:100%;height:100%;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.05))
         drop-shadow(0 0 0 rgba(0,0,0,.02));
}

/* ============================================================
   ③ ENVELOPE — kraft paper, 3D folded
   ============================================================ */
.envelope-scene{
  position:relative;z-index:1;
  width:130px;height:90px;
  transform:perspective(700px) rotateX(3deg) rotateY(-5deg) rotate(-1deg);
  transform-style:preserve-3d;
}
.envelope-scene::after{
  content:"";position:absolute;
  bottom:-16px;left:5%;width:90%;height:18px;
  background:rgba(120,100,80,.1);
  border-radius:50%;
  filter:blur(14px);
  z-index:-1;
  transform:translateZ(-10px);
}
.envelope-svg{
  width:100%;height:100%;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.05))
         drop-shadow(0 8px 16px rgba(100,80,60,.04));
}

/* ============================================================
   ④ CAT — silver shaded British Shorthair, 3D lighting
   ============================================================ */
.cat-scene{
  position:relative;z-index:1;
  width:140px;height:140px;
  transform:perspective(700px) rotateX(1deg) rotateY(-3deg) rotate(3deg);
  transform-style:preserve-3d;
}
.cat-scene::after{
  content:"";position:absolute;
  bottom:-18px;left:5%;width:90%;height:24px;
  background:rgba(120,100,80,.1);
  border-radius:50%;
  filter:blur(18px);
  z-index:-1;
  transform:translateZ(-12px);
}

/* Cat image container — the cat itself, transparent bg */
.cat-img-wrap{
  position:relative;z-index:2;
  width:140px;height:140px;
  filter:
    drop-shadow(0 4px 10px rgba(0,0,0,.08))
    drop-shadow(0 12px 28px rgba(80,60,40,.06));
  /* 3D subtle volume lighting */
}
.cat-img-wrap img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}

/* Soft rim light overlay — gives 3D volume */
.cat-img-wrap::after{
  content:"";
  position:absolute;inset:0;
  border-radius:50%;
  background:
    radial-gradient(ellipse 50% 50% at 35% 30%,rgba(255,255,255,.15) 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 65% 70%,rgba(0,0,0,.06) 0%,transparent 60%);
  pointer-events:none;
}

/* ============================================================
   PAGE LAYOUT
   ============================================================ */
.showcase{
  display:flex;align-items:flex-end;justify-content:center;
  gap:3.5rem;flex-wrap:wrap;
  padding:2rem;
}
.showcase-title{
  width:100%;text-align:center;
  font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:#b0a090;margin-bottom:1rem;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:700px){
  .showcase{gap:2rem}
  .polaroid-scene{width:140px;height:172px}
  .jar-scene{width:80px;height:104px}
  .envelope-scene{width:104px;height:72px}
  .cat-scene{width:110px;height:110px}
  .cat-img-wrap{width:110px;height:110px}
}
</style>
</head>
<body>

<div class="showcase">

  <div class="showcase-title">DIGITAL ARCHIVE · CYBERCORE ORNAMENTS</div>

  <!-- ════════════════════════════════════════════════
       ① POLAROID
       ════════════════════════════════════════════════ -->
  <div class="obj-wrapper">
    <div class="polaroid-scene">
      <div class="polaroid-card">
        <div class="polaroid-photo">
          <span class="p-subject">📷</span>
        </div>
        <div class="polaroid-caption">about me</div>
      </div>
      <div class="polaroid-tape"></div>
    </div>
    <span class="obj-label">拍立得</span>
  </div>

  <!-- ════════════════════════════════════════════════
       ② GLASS JAR
       ════════════════════════════════════════════════ -->
  <div class="obj-wrapper">
    <div class="jar-scene">
      <svg class="jar-svg" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Glass body gradient -->
          <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(220,215,205,.25)"/>
            <stop offset="15%"  stop-color="rgba(255,255,252,.45)"/>
            <stop offset="30%"  stop-color="rgba(255,255,252,.65)"/>
            <stop offset="50%"  stop-color="rgba(248,245,238,.5)"/>
            <stop offset="70%"  stop-color="rgba(255,255,250,.4)"/>
            <stop offset="88%"  stop-color="rgba(235,230,220,.35)"/>
            <stop offset="100%" stop-color="rgba(210,205,195,.2)"/>
          </linearGradient>
          <!-- Glass edge highlight -->
          <linearGradient id="jarEdge" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(180,170,155,.2)"/>
            <stop offset="50%"  stop-color="rgba(200,190,175,.1)"/>
            <stop offset="100%" stop-color="rgba(180,170,155,.15)"/>
          </linearGradient>
          <!-- Contents shimmer -->
          <radialGradient id="jarGlow" cx="35%" cy="40%">
            <stop offset="0%"   stop-color="rgba(255,255,255,.25)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>

        <!-- Ground shadow ellipse -->
        <ellipse cx="50" cy="118" rx="35" ry="8" fill="rgba(140,120,100,.08)" filter="blur(3px)"/>

        <!-- Jar body outline — thin, soft -->
        <rect x="16" y="32" width="68" height="78" rx="6"
              fill="url(#jarGlass)" stroke="rgba(180,170,155,.25)" stroke-width="1.5"/>

        <!-- Colored content blocks inside jar (matte) -->
        <rect x="23" y="62" width="18" height="10" rx="2"
              fill="rgba(107,143,92,.45)"/>
        <rect x="45" y="56" width="20" height="10" rx="2"
              fill="rgba(195,140,138,.4)"/>
        <rect x="27" y="78" width="22" height="10" rx="2"
              fill="rgba(195,160,100,.4)"/>
        <rect x="32" y="94" width="16" height="10" rx="2"
              fill="rgba(130,160,180,.35)"/>

        <!-- Inner glass shine — soft vertical highlight -->
        <rect x="20" y="38" width="8" height="60" rx="4"
              fill="rgba(255,255,255,.35)"/>

        <!-- Glass rim highlight -->
        <ellipse cx="50" cy="32" rx="34" ry="4"
                 fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>

        <!-- Cork lid — matte, textured -->
        <rect x="18" y="20" width="64" height="14" rx="4"
              fill="rgba(185,155,115,.75)"/>
        <!-- Cork inner highlight -->
        <rect x="22" y="23" width="56" height="6" rx="2"
              fill="rgba(210,180,140,.45)"/>
        <!-- Cork grain lines -->
        <line x1="24" y1="22" x2="30" y2="22" stroke="rgba(160,130,95,.25)" stroke-width=".5"/>
        <line x1="40" y1="23" x2="48" y2="23" stroke="rgba(160,130,95,.2)" stroke-width=".5"/>
        <line x1="55" y1="22" x2="60" y2="22" stroke="rgba(160,130,95,.2)" stroke-width=".5"/>
        <line x1="28" y1="26" x2="35" y2="26" stroke="rgba(160,130,95,.2)" stroke-width=".5"/>
        <line x1="52" y1="25" x2="56" y2="25" stroke="rgba(160,130,95,.2)" stroke-width=".5"/>

        <!-- Lid top ellipse -->
        <ellipse cx="50" cy="20" rx="32" ry="3.5"
                 fill="rgba(200,170,130,.55)" stroke="rgba(180,150,110,.3)" stroke-width=".8"/>

        <!-- Subtle glass reflection arc -->
        <path d="M18 40 Q18 70 25 100" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="obj-label">玻璃罐</span>
  </div>

  <!-- ════════════════════════════════════════════════
       ③ ENVELOPE
       ════════════════════════════════════════════════ -->
  <div class="obj-wrapper">
    <div class="envelope-scene">
      <svg class="envelope-svg" viewBox="0 0 130 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Kraft paper gradient -->
          <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#e8dcc8"/>
            <stop offset="30%"  stop-color="#e5d8c0"/>
            <stop offset="60%"  stop-color="#ddd0b8"/>
            <stop offset="100%" stop-color="#d8cbb0"/>
          </linearGradient>
          <!-- Kraft lighter -->
          <linearGradient id="kraftLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ede2ce"/>
            <stop offset="100%" stop-color="#e2d5bd"/>
          </linearGradient>
          <!-- Paper fiber -->
          <pattern id="fiber" width="80" height="60" patternUnits="userSpaceOnUse">
            <line x1="0" y1="15" x2="80" y2="16" stroke="rgba(0,0,0,.012)" stroke-width=".5"/>
            <line x1="0" y1="35" x2="80" y2="34" stroke="rgba(0,0,0,.01)" stroke-width=".4"/>
            <line x1="0" y1="52" x2="80" y2="53" stroke="rgba(0,0,0,.008)" stroke-width=".3"/>
          </pattern>
        </defs>

        <!-- Shadow plane -->
        <rect x="10" y="10" width="110" height="70" rx="3" fill="rgba(140,120,100,.06)" filter="blur(3px)"/>

        <!-- Envelope body back -->
        <rect x="4" y="18" width="118" height="64" rx="2.5" fill="url(#kraftPaper)"/>
        <rect x="4" y="18" width="118" height="64" rx="2.5" fill="url(#fiber)"/>

        <!-- Subtle paper edge shadow -->
        <rect x="4" y="18" width="118" height="64" rx="2.5" fill="none"
              stroke="rgba(180,160,135,.2)" stroke-width=".8"/>

        <!-- Flap triangle (folded) -->
        <polygon points="4,18 62,52 120,18"
                 fill="url(#kraftLight)"/>
        <polygon points="4,18 62,52 120,18"
                 fill="url(#fiber)"/>

        <!-- Flap edge lines (slight wear) -->
        <line x1="4" y1="18" x2="62" y2="52" stroke="rgba(180,160,135,.18)" stroke-width=".6"/>
        <line x1="120" y1="18" x2="62" y2="52" stroke="rgba(180,160,135,.18)" stroke-width=".6"/>

        <!-- Fold crease at top -->
        <line x1="4" y1="18" x2="120" y2="18" stroke="rgba(160,140,120,.12)" stroke-width=".6"/>

        <!-- Wax seal — 3D embossed -->
        <circle cx="62" cy="40" r="8" fill="rgba(195,140,135,.55)"/>
        <circle cx="62" cy="40" r="6.5" fill="rgba(200,145,140,.65)"/>
        <!-- Seal highlight — top-left light -->
        <ellipse cx="59" cy="37" rx="3" ry="2.2" fill="rgba(255,255,255,.2)"/>
        <!-- Seal inner ring -->
        <circle cx="62" cy="40" r="4" fill="none" stroke="rgba(180,120,115,.3)" stroke-width=".5"/>
        <!-- Seal center dot -->
        <circle cx="62" cy="40" r="1.8" fill="rgba(175,115,110,.5)"/>

        <!-- Bottom fold line shadow -->
        <line x1="8" y1="76" x2="116" y2="76" stroke="rgba(160,140,120,.1)" stroke-width=".5"/>

        <!-- Subtle corner wear -->
        <rect x="4" y="18" width="118" height="64" rx="2.5" fill="none"
              stroke="rgba(200,180,155,.06)" stroke-width="2"/>
      </svg>
    </div>
    <span class="obj-label">信封</span>
  </div>

  <!-- ════════════════════════════════════════════════
       ④ CAT — 多米, silver shaded British Shorthair
       ════════════════════════════════════════════════ -->
  <div class="obj-wrapper">
    <div class="cat-scene">
      <div class="cat-img-wrap">
        <img src="多米/抠图转透明背景 (8).png" alt="多米">
      </div>
    </div>
    <span class="obj-label">多米</span>
  </div>

</div><!-- /.showcase -->

</body>
</html>
